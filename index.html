<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flux — persoonlijke boekhouding</title>
  <meta name="description" content="Flux: je persoonlijke boekhouding">
  <meta name="theme-color" content="#3b5bdb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flux">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<body>
  <header class="topbar">

    <nav id="nav">
      <button data-view="dashboard">Overzicht</button>
      <button data-view="transactions">Transacties</button>

  </header>
  <main id="main"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/lookup.js"></script>
  <script src="js/sync.js"></script>
